name: Check Daily Reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-reminders API
        run: |
          curl -f -X POST "${{ secrets.APP_URL }}/api/cron/check-reminders" \
            -H "Authorization: Bearer ${{ secrets.REMINDER_CRON_SECRET }}"
